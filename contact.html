<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | CampusMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-md">
      <div class="container mx-auto flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold tracking-wide"
          >🎓 CampusMart</a
        >
        <div class="space-x-6 font-medium">
          <a href="index.html" class="hover:text-blue-200 transition">Home</a>
          <a href="products.html" class="hover:text-blue-200 transition"
            >Products</a
          >
          <a href="contact.html" class="hover:text-blue-200 transition"
            >Contact</a
          >
        </div>
      </div>
    </nav>

    <main class="container mx-auto px-4 py-12 flex-grow max-w-xl">
      <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Drop a Suggestion</h1>
        <p class="text-gray-500 text-sm mb-6">
          Want us to stock a specific product? Let us know below.
        </p>

        <form
          action="#"
          method="POST"
          onsubmit="
            alert('Form submitted! (Insecure Client Simulation)');
            return false;
          "
          class="space-y-4"
        >
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1"
              >Full Name</label
            >
            <input
              type="text"
              placeholder="John Doe"
              required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-800"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1"
              >Matric Number / Email</label
            >
            <input
              type="text"
              placeholder="22/XXXXX"
              required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-800"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1"
              >Message</label
            >
            <textarea
              rows="4"
              placeholder="Type your items or complaints here..."
              required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-800"
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition"
          >
            Submit Feedback
          </button>
        </form>
      </div>
    </main>

    <footer
      class="bg-gray-800 text-gray-400 py-6 text-center border-t border-gray-700 text-sm"
    >
      <p>&copy; 2026 CampusMart Supermarket. All Security Testing Allowed.</p>
    </footer>
  </body>
</html>
